name: Tests and release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development environment
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check tracked source
        run: python scripts/check_source.py
      - name: Run regression and browser tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Audit installed dependencies
        run: python -m pip_audit
      - name: Build clean source release
        run: python scripts/release.py
      - name: Verify release in a clean runtime
        run: python -c "import glob,subprocess,sys; subprocess.run([sys.executable,'scripts/smoke_release.py',glob.glob('dist/*.zip')[0]],check=True)"
